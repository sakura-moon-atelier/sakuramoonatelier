name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SITE_URL:           ${{ vars.VITE_SITE_URL }}
          VITE_GA_ID:              ${{ vars.VITE_GA_ID }}
          VITE_FORMSPREE_ID:       ${{ secrets.VITE_FORMSPREE_ID }}
          VITE_MAILCHIMP_URL:      ${{ secrets.VITE_MAILCHIMP_URL }}
          VITE_SENTRY_DSN:         ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SOCIAL_INSTAGRAM:   ${{ vars.VITE_SOCIAL_INSTAGRAM }}
          VITE_SOCIAL_TWITTER:     ${{ vars.VITE_SOCIAL_TWITTER }}
          VITE_SOCIAL_BLUESKY:     ${{ vars.VITE_SOCIAL_BLUESKY }}
          VITE_SOCIAL_TIKTOK:      ${{ vars.VITE_SOCIAL_TIKTOK }}
          VITE_SOCIAL_DISCORD:     ${{ vars.VITE_SOCIAL_DISCORD }}
          VITE_SOCIAL_TWITCH:      ${{ vars.VITE_SOCIAL_TWITCH }}
          VITE_SOCIAL_ITCHIO:      ${{ vars.VITE_SOCIAL_ITCHIO }}
          VITE_SOCIAL_STEAM:       ${{ vars.VITE_SOCIAL_STEAM }}
          VITE_PRESS_KIT_URL:      ${{ vars.VITE_PRESS_KIT_URL }}
          VITE_STEAM_WISHLIST:     ${{ vars.VITE_STEAM_WISHLIST }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
